name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/diamondpanel?schema=public
      AUTH_SECRET: ci-auth-secret
      NUXT_PUBLIC_LEAGUE_NAME: DiamondPanel CI

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
